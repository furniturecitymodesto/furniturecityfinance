<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furniture City Finance – Pre-Qualification</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
            text-align: center;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #444;
            margin-bottom: 30px;
        }
        .finance-btn {
            background: #1a73e8;
            color: white;
            padding: 14px 26px;
            border-radius: 8px;
            display: inline-block;
            font-size: 18px;
            cursor: pointer;
        }
    </style>

    <script>
    (function (u, p, l, i, f, t, o, b, j) { 
        u['UpLiftPlatformObject'] = f; 
        u[f] = u[f] || function () { 
            (u[f].q = u[f].q || []).push(arguments) 
        }, 
        u[f].l = 1 * new Date(); 
        b = p.createElement(l), j = p.getElementsByTagName(l)[0]; 
        b.async = 1; 
        b.src = i + '?upcode=' + t; 
        j.parentNode.insertBefore(b, j); 
        o = u.location.host.match(/[\w-]+\.\w{2,3}(:\d+)?$/); 
        if (o) o = o[0]; 
        u[f]('create', t, o) 
    })(window, document, 'script', 'https://tag.uplift.com/external/up.js', 'up', 'UP-XXXXXXXX-XX');
    </script>

    <script>
        function initPayMonthly() {
          window.console.log("Initializing Uplift Payments...");
          window.Uplift.Payments.init({
            locale: "en-US",
            currency: "USD",
            checkout: false,
            channel: "desktop"
          });
        }

        window.upReady = function() {
            initPayMonthly();
            window.Uplift.Payments.load();
            document.querySelector("[data-up-prequal]").style.display = "block";
        }
    </script>

</head>
<body>

<div class="container">
    <h1>Apply for Financing</h1>
    <p>Get pre-qualified with no impact to your credit score.</p>

    <div data-up-prequal style="display:none;">
        <div class="finance-btn">Check Monthly Payments</div>
    </div>
</div>

</body>
</html>
